name: CI Matrix (Maven & Gradle on JDK 21, 25, 26)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.build-tool }} / JDK ${{ matrix.java }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        java: [ '21', '25', '26' ]
        build-tool: [ 'maven', 'gradle' ]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.java == '21' && 'temurin' || 'oracle' }}

      - name: Build & Test with Maven
        if: ${{ matrix.build-tool == 'maven' }}
        run: mvn clean verify -B -Dlicense.mock.mode=true

      - name: Setup Gradle
        if: ${{ matrix.build-tool == 'gradle' }}
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build & Test with Gradle
        if: ${{ matrix.build-tool == 'gradle' }}
        run: gradle test check --info
