name: CI Matrix (Maven & Gradle on JDK 21, 25, 26)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.build-tool }} / JDK ${{ matrix.java }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        java: [ '21', '25', '26-ea' ]
        build-tool: [ 'maven', 'gradle' ]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.java == '26-ea' && 'oracle' || matrix.java == '25' && 'oracle' || 'temurin' }}

      - name: Build & Test with Maven
        if: ${{ matrix.build-tool == 'maven' }}
        run: mvn clean verify -B -Dlicense.mock.mode=true

      - name: Setup Gradle
        if: ${{ matrix.build-tool == 'gradle' }}
        uses: gradle/actions/setup-gradle@v4

      - name: Build & Test with Gradle
        if: ${{ matrix.build-tool == 'gradle' }}
        run: gradle test check --info
